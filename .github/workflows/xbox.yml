# Compila o projeto UWP (xbox/) e gera o pacote para instalar no Xbox em modo desenvolvedor
# pelo Device Portal. O resultado fica em Actions -> execução -> Artifacts -> "MundialHax-Xbox".
name: Pacote Xbox (UWP)

on:
  workflow_dispatch:
  push:
    paths:
      - "xbox/**"
      - "js/**"
      - "css/**"
      - "index.html"
      - ".github/workflows/xbox.yml"

permissions:
  contents: read

jobs:
  pacote:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      # Certificado de teste descartável (o assunto precisa ser igual ao Publisher do manifesto).
      - name: Certificado de teste
        shell: pwsh
        run: |
          $senha = [guid]::NewGuid().ToString("N")
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=MundialHax" -KeyUsage DigitalSignature -FriendlyName "MundialHax (teste)" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          Export-PfxCertificate -Cert $cert -FilePath "xbox\MundialHax\MundialHax_Teste.pfx" -Password (ConvertTo-SecureString $senha -AsPlainText -Force) | Out-Null
          "CERT_SENHA=$senha" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CERT_DIGITAL=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compilar e empacotar
        shell: pwsh
        run: |
          msbuild xbox\MundialHax.sln /restore /m `
            /p:Configuration=Release /p:Platform=x64 `
            /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly /p:GenerateAppxPackageOnBuild=true `
            /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile=MundialHax_Teste.pfx `
            /p:PackageCertificatePassword=$env:CERT_SENHA /p:PackageCertificateThumbprint=$env:CERT_DIGITAL `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\pacote\"

      # Confere se os arquivos do jogo entraram no pacote.
      - name: Conferir conteúdo
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Path pacote -Recurse -Include *.msix, *.appx | Where-Object { $_.FullName -notmatch "Dependencies" } | Select-Object -First 1
          if (-not $pkg) { throw "Pacote não foi gerado." }
          Write-Host "Pacote: $($pkg.FullName) ($([math]::Round($pkg.Length / 1MB, 2)) MB)"
          Copy-Item $pkg.FullName "$env:RUNNER_TEMP\pkg.zip"
          Expand-Archive "$env:RUNNER_TEMP\pkg.zip" -DestinationPath "$env:RUNNER_TEMP\pkg" -Force
          foreach ($f in "www\index.html", "www\js\ui\app.js", "www\js\game\engine.js", "www\js\data\squads.js", "www\css\style.css") {
            if (-not (Test-Path "$env:RUNNER_TEMP\pkg\$f")) { throw "Faltou no pacote: $f" }
          }
          Write-Host "Arquivos do jogo presentes no pacote."
          Get-ChildItem -Path pacote -Recurse -File | ForEach-Object { Write-Host $_.FullName.Replace("$env:GITHUB_WORKSPACE\", "") }

      - uses: actions/upload-artifact@v4
        with:
          name: MundialHax-Xbox
          path: pacote/
          if-no-files-found: error
